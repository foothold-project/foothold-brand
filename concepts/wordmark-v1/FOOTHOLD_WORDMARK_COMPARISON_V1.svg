      <use href="#symbol" width="116" height="116"/>
    </g>
    <text x="298" y="1398" class="b-word" font-size="99" fill="#161C26" textLength="670" lengthAdjust="spacingAndGlyphs">FOOTHOLD</text>
    <line x1="298" y1="1424" x2="968" y2="1424" stroke="#161C26" stroke-width="2"/>
    <text x="298" y="1462" class="technical" font-size="16" letter-spacing="2.1" fill="#4A5566">TERRAIN-ADAPTIVE LOCOMOTION POLICY</text>

    <g>
      <text x="150" y="1550" class="panel-label" fill="#7C8798">REVERSE / DARK</text>
      <rect x="150" y="1574" width="520" height="190" rx="14" fill="#161C26"/>
      <g transform="translate(184 1618)" fill="#62BBAF"><use href="#symbol" width="66" height="66"/></g>
      <text x="270" y="1671" class="b-word" font-size="41" fill="#F6F5F1" textLength="330" lengthAdjust="spacingAndGlyphs">FOOTHOLD</text>
      <line x1="270" y1="1685" x2="600" y2="1685" stroke="#7C8798"/>
      <text x="270" y="1717" class="technical" font-size="9" letter-spacing=".9" fill="#B7C0CC">TERRAIN-ADAPTIVE LOCOMOTION POLICY</text>
    </g>

    <g>
      <text x="700" y="1550" class="panel-label" fill="#7C8798">WEBSITE HEADER / SMALL</text>
      <rect x="700" y="1574" width="520" height="190" rx="14" fill="#F6F5F1" stroke="#D9D6CD"/>
      <g transform="translate(730 1618)" fill="#0E7A6E"><use href="#symbol" width="52" height="52"/></g>
      <text x="797" y="1658" class="b-word" font-size="27" fill="#161C26" textLength="215" lengthAdjust="spacingAndGlyphs">FOOTHOLD</text>
      <text x="1068" y="1658" class="ui micro" fill="#4A5566">PROJECT</text>
      <line x1="730" y1="1690" x2="1190" y2="1690" stroke="#D9D6CD"/>
      <text x="730" y="1726" class="technical" font-size="12" fill="#7C8798">WHY / SYSTEM / EVIDENCE / TEAM</text>
    </g>

    <g>
      <text x="1250" y="1550" class="panel-label" fill="#7C8798">POSTER CROP / LARGE</text>
      <rect x="1250" y="1574" width="600" height="190" rx="14" fill="#EEECE6" stroke="#D9D6CD"/>
      <g clip-path="url(#posterCropB)">
        <text x="1268" y="1723" class="b-word" font-size="152" fill="#161C26" textLength="900" lengthAdjust="spacingAndGlyphs">FOOTHOLD</text>
        <line x1="1270" y1="1739" x2="1800" y2="1739" stroke="#161C26" stroke-width="3"/>
      </g>
      <text x="1779" y="1606" class="technical" font-size="12" text-anchor="end" fill="#A86A08">A3 / 02</text>
    </g>

    <!-- OPTION C -->
    <g filter="url(#shadow)">
      <rect x="100" y="1900" width="1800" height="720" rx="24" fill="#FFFFFF" stroke="#D9D6CD" stroke-width="2"/>
    </g>
    <rect x="128" y="1928" width="306" height="38" rx="19" fill="#FBF0DC"/>
    <text x="150" y="1954" class="micro" fill="#7A4B05">C · EXPRESSIVE ALTERNATIVE</text>
    <text x="150" y="2018" font-size="36" font-weight="760" fill="#161C26">Terrain Motion</text>
    <text x="150" y="2053" class="caption">Forward energy · terrain cue · higher sports / mobility-brand risk</text>

    <g transform="translate(150 2085)" fill="#0E7A6E">
      <use href="#symbol" width="118" height="118"/>
    </g>
    <g transform="skewX(-6)">
      <text x="528" y="2179" class="c-word" font-size="107" fill="#161C26" textLength="670" lengthAdjust="spacingAndGlyphs">FOOTHOLD</text>
    </g>
    <path d="M300 2205h180l24-14h172l24-14h170" fill="none" stroke="#0E7A6E" stroke-width="7" stroke-linecap="square"/>
    <text x="300" y="2250" class="ui" font-size="17" font-weight="650" letter-spacing="2.5" fill="#4A5566">TERRAIN-ADAPTIVE LOCOMOTION POLICY</text>

    <g>
      <text x="150" y="2330" class="panel-label" fill="#7C8798">REVERSE / DARK</text>
      <rect x="150" y="2354" width="520" height="190" rx="14" fill="#161C26"/>
      <g transform="translate(184 2398)" fill="#62BBAF"><use href="#symbol" width="66" height="66"/></g>
      <g transform="skewX(-6)"><text x="527" y="2450" class="c-word" font-size="45" fill="#F6F5F1" textLength="328" lengthAdjust="spacingAndGlyphs">FOOTHOLD</text></g>
      <path d="M270 2467h92l10-7h92l10-7h92" fill="none" stroke="#62BBAF" stroke-width="4"/>
      <text x="270" y="2501" class="ui" font-size="9" font-weight="650" letter-spacing="1" fill="#B7C0CC">TERRAIN-ADAPTIVE LOCOMOTION POLICY</text>
    </g>

    <g>
      <text x="700" y="2330" class="panel-label" fill="#7C8798">WEBSITE HEADER / SMALL</text>
      <rect x="700" y="2354" width="520" height="190" rx="14" fill="#F6F5F1" stroke="#D9D6CD"/>
      <g transform="translate(730 2398)" fill="#0E7A6E"><use href="#symbol" width="52" height="52"/></g>
      <g transform="skewX(-6)"><text x="1053" y="2439" class="c-word" font-size="29" fill="#161C26" textLength="215" lengthAdjust="spacingAndGlyphs">FOOTHOLD</text></g>
      <text x="1068" y="2438" class="ui micro" fill="#4A5566">PROJECT</text>
      <line x1="730" y1="2470" x2="1190" y2="2470" stroke="#D9D6CD"/>
      <text x="730" y="2506" class="technical" font-size="12" fill="#7C8798">WHY / SYSTEM / EVIDENCE / TEAM</text>
    </g>

    <g>
      <text x="1250" y="2330" class="panel-label" fill="#7C8798">POSTER CROP / LARGE</text>
      <rect x="1250" y="2354" width="600" height="190" rx="14" fill="#EEECE6" stroke="#D9D6CD"/>
      <g clip-path="url(#posterCropC)" transform="skewX(-6)">
        <text x="1515" y="2503" class="c-word" font-size="160" fill="#161C26" textLength="900" lengthAdjust="spacingAndGlyphs">FOOTHOLD</text>
      </g>
      <path d="M1270 2519h160l22-12h160l22-12h160" fill="none" stroke="#0E7A6E" stroke-width="8"/>
      <text x="1779" y="2386" class="technical" font-size="12" text-anchor="end" fill="#A86A08">A3 / 03</text>
    </g>

    <line x1="100" y1="2670" x2="1900" y2="2670" stroke="#D9D6CD" stroke-width="2"/>
    <text x="100" y="2724" class="technical" font-size="16" fill="#0E7A6E">REVIEW SCOPE</text>
    <text x="270" y="2724" class="ui" font-size="18" fill="#4A5566">Visual direction only — no option is a canonical logo yet.</text>
    <text x="1900" y="2724" class="technical" font-size="14" text-anchor="end" fill="#7C8798">2026-08-07 / FOOTHOLD BRAND SYSTEM V1</text>
  </g>
</svg>
