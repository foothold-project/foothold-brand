<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2800" viewBox="0 0 2000 2800" role="img" aria-labelledby="title desc">
  <title id="title">FOOTHOLD wordmark direction comparison v1</title>
  <desc id="desc">Three provisional wordmark directions shown in primary, reverse, website header, and poster applications.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#161C26" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#161C26" flood-opacity=".08"/>
    </filter>
    <symbol id="symbol" viewBox="0 0 128 128">
      <path d="M64 6 118 50v20L64 28 10 70V50z"/>
      <path d="M64 43 106 78v20L64 63 22 98V78z"/>
      <path d="m64 93 19 16-19 16-19-16z"/>
    </symbol>
    <clipPath id="posterCropA"><rect x="1270" y="814" width="560" height="150" rx="12"/></clipPath>
    <clipPath id="posterCropB"><rect x="1270" y="1594" width="560" height="150" rx="12"/></clipPath>
    <clipPath id="posterCropC"><rect x="1270" y="2374" width="560" height="150" rx="12"/></clipPath>
    <style>
      .ui { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .ko { font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; }
      .technical { font-family: Consolas, "Courier New", monospace; }
      .a-word { font-family: Bahnschrift, "Arial Narrow", Arial, sans-serif; font-weight: 700; font-stretch: semi-condensed; letter-spacing: 1.5px; }
      .b-word { font-family: "Segoe UI", Arial, sans-serif; font-weight: 800; letter-spacing: 8px; }
      .c-word { font-family: Bahnschrift, "Arial Narrow", Arial, sans-serif; font-weight: 650; font-stretch: condensed; letter-spacing: 4px; }
      .eyebrow { font-size: 18px; font-weight: 700; letter-spacing: 3px; }
      .caption { font-size: 18px; fill: #4A5566; }
      .micro { font-size: 14px; font-weight: 650; letter-spacing: 1.4px; }
      .panel-label { font-size: 13px; font-weight: 700; letter-spacing: 1.8px; }
    </style>
  </defs>

  <rect width="2000" height="2800" fill="#F6F5F1"/>
  <rect width="2000" height="2800" fill="url(#grid)"/>

  <g class="ui">
    <text x="100" y="102" class="eyebrow" fill="#0E7A6E">FOOTHOLD / WORDMARK DIRECTION REVIEW / V1</text>
    <text x="100" y="188" font-size="64" font-weight="760" fill="#161C26">One identity. Three directions.</text>
    <text x="100" y="239" class="ko" font-size="24" fill="#4A5566">전체 브랜드 시스템에 적용하기 전, 동일한 조건에서 워드마크의 성격과 확장성을 비교합니다.</text>
    <line x1="100" y1="286" x2="1900" y2="286" stroke="#D9D6CD" stroke-width="2"/>

    <!-- OPTION A -->
    <g filter="url(#shadow)">
      <rect x="100" y="340" width="1800" height="720" rx="24" fill="#FFFFFF" stroke="#0E7A6E" stroke-width="3"/>
    </g>
    <rect x="128" y="368" width="356" height="38" rx="19" fill="#E0F0ED"/>
    <text x="150" y="394" class="micro" fill="#075E56">A · RECOMMENDED STARTING POINT</text>
    <text x="150" y="458" font-size="36" font-weight="760" fill="#161C26">Grounded Geometric</text>
    <text x="150" y="493" class="caption">Stable proportions · filled letterforms · restrained custom detail</text>

    <g transform="translate(150 525)" fill="#0E7A6E">
      <use href="#symbol" width="126" height="126"/>
    </g>
    <text x="304" y="624" class="a-word" font-size="112" fill="#161C26" textLength="650" lengthAdjust="spacingAndGlyphs">FOOTHOLD</text>
    <rect x="304" y="646" width="90" height="8" fill="#0E7A6E"/>
    <text x="304" y="690" class="ui" font-size="18" font-weight="650" letter-spacing="2.6" fill="#4A5566">TERRAIN-ADAPTIVE LOCOMOTION POLICY</text>

    <g>
      <text x="150" y="770" class="panel-label" fill="#7C8798">REVERSE / DARK</text>
      <rect x="150" y="794" width="520" height="190" rx="14" fill="#161C26"/>
      <g transform="translate(184 838)" fill="#DFF3EF"><use href="#symbol" width="70" height="70"/></g>
      <text x="270" y="894" class="a-word" font-size="48" fill="#F6F5F1" textLength="328" lengthAdjust="spacingAndGlyphs">FOOTHOLD</text>
      <rect x="270" y="907" width="44" height="4" fill="#62BBAF"/>
      <text x="270" y="937" class="ui" font-size="10" font-weight="650" letter-spacing="1.2" fill="#B7C0CC">TERRAIN-ADAPTIVE LOCOMOTION POLICY</text>
    </g>

    <g>
      <text x="700" y="770" class="panel-label" fill="#7C8798">WEBSITE HEADER / SMALL</text>
      <rect x="700" y="794" width="520" height="190" rx="14" fill="#F6F5F1" stroke="#D9D6CD"/>
      <g transform="translate(730 838)" fill="#0E7A6E"><use href="#symbol" width="54" height="54"/></g>
      <text x="797" y="879" class="a-word" font-size="32" fill="#161C26" textLength="213" lengthAdjust="spacingAndGlyphs">FOOTHOLD</text>
      <text x="1068" y="878" class="ui micro" fill="#4A5566">PROJECT</text>
      <line x1="730" y1="910" x2="1190" y2="910" stroke="#D9D6CD"/>
      <text x="730" y="946" class="technical" font-size="12" fill="#7C8798">WHY / SYSTEM / EVIDENCE / TEAM</text>
    </g>

    <g>
      <text x="1250" y="770" class="panel-label" fill="#7C8798">POSTER CROP / LARGE</text>
      <rect x="1250" y="794" width="600" height="190" rx="14" fill="#EEECE6" stroke="#D9D6CD"/>
      <g clip-path="url(#posterCropA)">
        <text x="1268" y="943" class="a-word" font-size="168" fill="#161C26" textLength="860" lengthAdjust="spacingAndGlyphs">FOOTHOLD</text>
        <rect x="1270" y="958" width="140" height="12" fill="#0E7A6E"/>
      </g>
      <text x="1779" y="826" class="technical" font-size="12" text-anchor="end" fill="#A86A08">A3 / 01</text>
    </g>

