<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1600" viewBox="0 0 2000 1600" role="img" aria-labelledby="title desc">
  <title id="title">FOOTHOLD A2 refined wordmark review</title>
  <desc id="desc">The existing FOOTHOLD symbol with a grounded geometric wordmark, subtle three-degree forward slant, no decorative underline, and a subtitle aligned to the full wordmark width.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#161C26" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#161C26" flood-opacity=".08"/>
    </filter>
    <filter id="symbolWhite" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0 0 0 0 .875  0 0 0 0 .953  0 0 0 0 .937  0 0 0 1 0"/>
    </filter>
    <clipPath id="posterCrop"><rect x="1376" y="927" width="424" height="142" rx="10"/></clipPath>
    <style>
      .ui { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .ko { font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; }
      .technical { font-family: Consolas, "Courier New", monospace; }
      .word { font-family: Bahnschrift, "Arial Narrow", Arial, sans-serif; font-weight: 700; font-stretch: semi-condensed; letter-spacing: 1.5px; }
      .eyebrow { font-size: 18px; font-weight: 700; letter-spacing: 3px; }
      .micro { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; }
      .caption { font-size: 18px; fill: #4A5566; }
    </style>
  </defs>

  <rect width="2000" height="1600" fill="#F6F5F1"/>
  <rect width="2000" height="1600" fill="url(#grid)"/>

  <g class="ui">
    <text x="100" y="94" class="eyebrow" fill="#0E7A6E">FOOTHOLD / WORDMARK REFINEMENT / A.2</text>
    <text x="100" y="174" font-size="58" font-weight="760" fill="#161C26">Grounded, with measured forward intent.</text>
    <text x="100" y="223" class="ko" font-size="23" fill="#4A5566">기존 심볼을 유지하고, A안의 안정감에 미세한 전진 기울기와 정렬 규칙을 적용했습니다.</text>
    <line x1="100" y1="268" x2="1900" y2="268" stroke="#D9D6CD" stroke-width="2"/>

    <g filter="url(#shadow)">
      <rect x="100" y="320" width="1800" height="470" rx="24" fill="#FFFFFF" stroke="#0E7A6E" stroke-width="3"/>
    </g>

    <rect x="132" y="350" width="234" height="38" rx="19" fill="#E0F0ED"/>
    <text x="154" y="376" class="micro" fill="#075E56">PRIMARY LOCKUP / A.2</text>

    <image href="../../../foothold_logo_symbol_transparent.png" x="174" y="432" width="136" height="152" preserveAspectRatio="xMidYMid meet"/>

    <!-- Alignment guides deliberately show that subtitle and wordmark share the same visual width. -->
    <line x1="350" y1="438" x2="350" y2="670" stroke="#0E7A6E" stroke-opacity=".35" stroke-width="2" stroke-dasharray="7 7"/>
    <line x1="1070" y1="438" x2="1070" y2="670" stroke="#0E7A6E" stroke-opacity=".35" stroke-width="2" stroke-dasharray="7 7"/>
    <g transform="translate(30 0) skewX(-3)">
      <text x="350" y="566" class="word" font-size="126" fill="#161C26" textLength="720" lengthAdjust="spacingAndGlyphs">FOOTHOLD</text>
    </g>
    <text x="350" y="633" class="ui" font-size="17" font-weight="680" letter-spacing="1" fill="#4A5566" textLength="720" lengthAdjust="spacing">TERRAIN-ADAPTIVE LOCOMOTION POLICY</text>
    <text x="350" y="686" class="technical" font-size="13" fill="#7C8798">WORDMARK WIDTH = SUBTITLE WIDTH / DECORATIVE LINE REMOVED</text>

    <g transform="translate(1260 368)">
      <rect width="570" height="70" rx="12" fill="#F6F5F1" stroke="#D9D6CD"/>
      <text x="24" y="29" class="micro" fill="#0E7A6E">01</text>
      <text x="72" y="29" font-size="16" font-weight="700" fill="#161C26">EXISTING SYMBOL PRESERVED</text>
      <text x="72" y="52" font-size="14" fill="#7C8798">No geometry change in this review</text>
    </g>
    <g transform="translate(1260 452)">
      <rect width="570" height="70" rx="12" fill="#F6F5F1" stroke="#D9D6CD"/>
      <text x="24" y="29" class="micro" fill="#0E7A6E">02</text>
      <text x="72" y="29" font-size="16" font-weight="700" fill="#161C26">3° FORWARD SLANT</text>
      <text x="72" y="52" font-size="14" fill="#7C8798">Less aggressive than Terrain Motion</text>
    </g>
    <g transform="translate(1260 536)">
      <rect width="570" height="70" rx="12" fill="#F6F5F1" stroke="#D9D6CD"/>
      <text x="24" y="29" class="micro" fill="#0E7A6E">03</text>
      <text x="72" y="29" font-size="16" font-weight="700" fill="#161C26">NO UNEXPLAINED UNDERLINE</text>
      <text x="72" y="52" font-size="14" fill="#7C8798">Contact motif removed from primary lockup</text>
    </g>
    <g transform="translate(1260 620)">
      <rect width="570" height="70" rx="12" fill="#F6F5F1" stroke="#D9D6CD"/>
      <text x="24" y="29" class="micro" fill="#0E7A6E">04</text>
      <text x="72" y="29" font-size="16" font-weight="700" fill="#161C26">MATCHED VISUAL WIDTH</text>
      <text x="72" y="52" font-size="14" fill="#7C8798">Subtitle begins and ends with FOOTHOLD</text>
    </g>

    <text x="100" y="858" class="micro" fill="#7C8798">APPLICATION CHECKS</text>

    <!-- DARK -->
    <g>
      <rect x="100" y="890" width="560" height="250" rx="18" fill="#161C26"/>
      <text x="132" y="927" class="micro" fill="#7C8798">REVERSE / DARK</text>
      <image href="../../../foothold_logo_symbol_transparent.png" x="136" y="947" width="86" height="96" preserveAspectRatio="xMidYMid meet" filter="url(#symbolWhite)"/>
      <g transform="translate(54 0) skewX(-3)">
        <text x="240" y="1019" class="word" font-size="52" fill="#F6F5F1" textLength="342" lengthAdjust="spacingAndGlyphs">FOOTHOLD</text>
      </g>
      <text x="240" y="1059" class="ui" font-size="8" font-weight="680" fill="#B7C0CC" textLength="342" lengthAdjust="spacing">TERRAIN-ADAPTIVE LOCOMOTION POLICY</text>
    </g>

    <!-- WEB -->
    <g>
      <rect x="720" y="890" width="560" height="250" rx="18" fill="#F6F5F1" stroke="#D9D6CD"/>
      <text x="752" y="927" class="micro" fill="#7C8798">WEBSITE HEADER / SMALL</text>
      <image href="../../../foothold_logo_symbol_transparent.png" x="748" y="950" width="64" height="72" preserveAspectRatio="xMidYMid meet"/>
      <g transform="translate(53 0) skewX(-3)">
        <text x="826" y="1004" class="word" font-size="34" fill="#161C26" textLength="224" lengthAdjust="spacingAndGlyphs">FOOTHOLD</text>
      </g>
      <text x="1112" y="1003" class="micro" fill="#4A5566">PROJECT</text>
      <line x1="752" y1="1038" x2="1248" y2="1038" stroke="#D9D6CD"/>
      <text x="752" y="1080" class="technical" font-size="12" fill="#7C8798">WHY / SYSTEM / EVIDENCE / TEAM</text>
    </g>

    <!-- POSTER -->
    <g>
      <rect x="1340" y="890" width="560" height="250" rx="18" fill="#EEECE6" stroke="#D9D6CD"/>
      <text x="1372" y="927" class="micro" fill="#7C8798">POSTER CROP / LARGE</text>
      <g clip-path="url(#posterCrop)">
        <g transform="translate(62 0) skewX(-3)">
          <text x="1372" y="1080" class="word" font-size="176" fill="#161C26" textLength="900" lengthAdjust="spacingAndGlyphs">FOOTHOLD</text>
        </g>
      </g>
      <text x="1868" y="1110" class="technical" font-size="12" text-anchor="end" fill="#A86A08">A3 / A.2</text>
    </g>

    <!-- NEXT ROUND -->
    <rect x="100" y="1200" width="1800" height="260" rx="20" fill="#EEECE6" stroke="#D9D6CD"/>
    <text x="140" y="1252" class="micro" fill="#0E7A6E">NEXT ROUND AFTER DIRECTION APPROVAL</text>
    <text x="140" y="1304" font-size="27" font-weight="740" fill="#161C26">Turn the selected typographic direction into an ownable FOOTHOLD wordmark.</text>
    <g transform="translate(140 1344)">
      <circle cx="9" cy="-6" r="6" fill="#0E7A6E"/>
      <text x="28" y="0" class="caption">Custom O counter and corner geometry</text>
    </g>
    <g transform="translate(640 1344)">
      <circle cx="9" cy="-6" r="6" fill="#0E7A6E"/>
      <text x="28" y="0" class="caption">Terminal and crossbar refinement</text>
    </g>
    <g transform="translate(1130 1344)">
      <circle cx="9" cy="-6" r="6" fill="#0E7A6E"/>
      <text x="28" y="0" class="caption">Optical spacing and symbol ratio</text>
    </g>
    <text x="140" y="1414" class="technical" font-size="14" fill="#7C8798">PROVISIONAL LIVE TYPE — NOT A CANONICAL LOGO ASSET</text>

    <text x="100" y="1532" class="technical" font-size="14" fill="#0E7A6E">FOOTHOLD BRAND SYSTEM V1</text>
    <text x="1900" y="1532" class="technical" font-size="14" text-anchor="end" fill="#7C8798">2026-08-07 / A.2 REVIEW</text>
  </g>
</svg>
