<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FOOTHOLD Brand Sync</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:var(--figma-color-text);background:var(--figma-color-bg)}
    body{margin:0;padding:20px}.eyebrow{color:#0e7a6e;font-size:11px;font-weight:700;letter-spacing:.12em}
    h1{font-size:22px;margin:8px 0 6px}.sub{font-size:12px;color:var(--figma-color-text-secondary);line-height:1.5;margin-bottom:18px}
    .actions{display:grid;gap:8px}button{appearance:none;border:1px solid var(--figma-color-border);background:var(--figma-color-bg-secondary);color:var(--figma-color-text);padding:11px 12px;border-radius:8px;text-align:left;font-weight:600;cursor:pointer}
    button.primary{background:#0e7a6e;color:white;border-color:#0e7a6e}button:hover{filter:brightness(.97)}
    .rule{height:1px;background:var(--figma-color-border);margin:18px 0}.status{font-size:12px;line-height:1.5;color:var(--figma-color-text-secondary)}
    pre{white-space:pre-wrap;word-break:break-word;max-height:210px;overflow:auto;background:var(--figma-color-bg-secondary);border:1px solid var(--figma-color-border);border-radius:8px;padding:10px;font-size:10px}
  </style>
</head>
<body>
  <div class="eyebrow">FOOTHOLD / LOCAL SYNC</div>
  <h1>Brand Master Board</h1>
  <div class="sub">Git is canonical. Figma edits remain proposals until exported and approved.</div>
  <div class="actions">
    <button data-command="inspect">1. Inspect file</button>
    <button data-command="sync-foundations">2. Sync foundations</button>
    <button class="primary" data-command="build-skeleton">3. Build Master Board skeleton</button>
    <button data-command="export">4. Export JSON + SVG + PNG review package</button>
  </div>
  <div class="rule"></div>
  <div id="status" class="status">Loading canonical source…</div>
  <pre id="result" hidden></pre>
  <script>
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    document.querySelectorAll('button').forEach((button) => button.onclick = () => parent.postMessage({pluginMessage:{command:button.dataset.command}}, '*'));
    function download(file){
      const blob = file.text !== undefined ? new Blob([file.text],{type:file.mime}) : new Blob([new Uint8Array(file.bytes)],{type:file.mime});
      const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=file.name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
    }
    const crcTable=(()=>{const table=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;table[n]=c>>>0;}return table;})();
    function crc32(bytes){let crc=0xffffffff;for(const byte of bytes)crc=crcTable[(crc^byte)&0xff]^(crc>>>8);return(crc^0xffffffff)>>>0;}
    function fileBytes(file){return file.text!==undefined?new TextEncoder().encode(file.text):new Uint8Array(file.bytes);}
    function zipStore(files){
      const locals=[];const centrals=[];let offset=0;let centralSize=0;
      const now=new Date();const dosTime=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1);const dosDate=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
      for(const file of files){
        const name=new TextEncoder().encode(file.name);const data=fileBytes(file);const crc=crc32(data);
        const local=new Uint8Array(30+name.length+data.length);const lv=new DataView(local.buffer);
        lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0,true);lv.setUint16(8,0,true);lv.setUint16(10,dosTime,true);lv.setUint16(12,dosDate,true);lv.setUint32(14,crc,true);lv.setUint32(18,data.length,true);lv.setUint32(22,data.length,true);lv.setUint16(26,name.length,true);lv.setUint16(28,0,true);local.set(name,30);local.set(data,30+name.length);locals.push(local);
        const central=new Uint8Array(46+name.length);const cv=new DataView(central.buffer);
        cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0,true);cv.setUint16(10,0,true);cv.setUint16(12,dosTime,true);cv.setUint16(14,dosDate,true);cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,name.length,true);cv.setUint16(30,0,true);cv.setUint16(32,0,true);cv.setUint16(34,0,true);cv.setUint16(36,0,true);cv.setUint32(38,0,true);cv.setUint32(42,offset,true);central.set(name,46);centrals.push(central);offset+=local.length;centralSize+=central.length;
      }
      const end=new Uint8Array(22);const ev=new DataView(end.buffer);ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);ev.setUint32(12,centralSize,true);ev.setUint32(16,offset,true);ev.setUint16(20,0,true);
      return new Blob([...locals,...centrals,end],{type:'application/zip'});
    }
    function downloadBundle(bundle){const blob=zipStore(bundle.files);const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=bundle.name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
    onmessage=(event)=>{
      const message=event.data.pluginMessage;
      if(!message)return;
      if(message.type==='ready')status.textContent=`Ready · v${message.payload.brandVersion} · ${message.payload.sourceDigest.slice(0,12)}`;
      if(message.type==='status')status.textContent=message.payload.message;
      if(message.type==='error'){status.textContent=`Error: ${message.payload.message}`;result.hidden=true;}
      if(message.type==='result'){status.textContent=`Completed: ${message.payload.command}`;result.hidden=false;result.textContent=JSON.stringify(message.payload.result,null,2);}
      if(message.type==='downloads'){message.payload.files.forEach(download);(message.payload.bundles||[]).forEach(downloadBundle);}
    };
  </script>
</body>
</html>
